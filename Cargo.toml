[package]
name = "conduit"
version = "0.1.0"
edition = "2021"
authors = ["Shun Namiki a.k.a Nash <snamiki1212@gmail.com>"]
license = "MIT"
repository = "https://github.com/snamiki1212/realworld-rust-actix-web"
readme = "README.md"
description = "Realworld Application with Rust / axum / sqlx."

[dependencies]

# Ergonomic and modular web framework built with Tokio, Tower, and Hyper
axum = { version = "0.7" }

# An event-driven, non-blocking I/O platform for writing asynchronous applications
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

# The Rust SQL Toolkit: async PostgreSQL driver and connection pool
sqlx = { version = "0.7", default-features = false, features = [
  "runtime-tokio",
  "postgres",
  "chrono",
  "uuid",
] }

# Type-erased async functions in traits, for the repository and usecase objects
async-trait = { version = "0.1" }

# Strongly-typed MIME types, for the JSON content-type check
mime = { version = "0.3" }

# `x-www-form-urlencoded` meets Serde, for query strings
serde_urlencoded = { version = "0.7" }

# Create and decode JWTs in a strongly typed way.
jsonwebtoken = { version = "8.3" }

# A generic serialization/deserialization framework
serde = { version = "1.0", features = ["derive"] }

# A JSON serialization file format
serde_json = { version = "1.0" }

# A `dotenv` implementation for Rust
dotenv = { version = "0.15" }

# Date and time library for Rust
chrono = { version = "0.4", features = ["serde"] }

# Easily hash and verify passwords using bcrypt
bcrypt = { version = "0.14.0" }

# A lightweight logging facade for Rust
log = { version = "0.4.17" }

# A logging implementation for `log` which is configured via an environment variable.
env_logger = { version = "0.10.0" }

# Flexible concrete Error type built on std::error::Error
anyhow = { version = "1.0" }

# derive(Error)
thiserror = { version = "1.0" }

# Convert strings into any case
convert_case = { version = "0.6.0" }

# A library to generate and parse UUIDs.
[dependencies.uuid]
version = "1.3.3"
features = ["serde", "v4"]
